<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Mini Blender Ultra</title>

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <header>
        <b>
            ◈ Mini Blender
            <small>ULTRA</small>
        </b>

        <nav id="menus"></nav>

        <button id="clone">⧉ Clone</button>
        <button id="camera">▣ Camera</button>
        <button id="help">?</button>
        <button id="panels">☰</button>

        <span id="title">MyProject</span>
    </header>

    <aside id="tools">

        <div>
            <button data-m="translate">
                ✥
                <small>Move</small>
            </button>

            <button data-m="rotate">
                ↻
                <small>Rotate</small>
            </button>

            <button data-m="scale">
                ⤢
                <small>Scale</small>
            </button>
        </div>

        <div>
            <button id="cube">
                ■
                <small>Cube</small>
            </button>

            <button id="sphere">
                ●
                <small>Sphere</small>
            </button>

            <button id="light">
                ✦
                <small>Light</small>
            </button>

            <button id="camadd">
                ▷
                <small>Camera</small>
            </button>
        </div>

        <div>
            <button id="focus">
                ◎
                <small>Focus</small>
            </button>

            <button id="clone2">
                ⧉
                <small>Clone</small>
            </button>

            <button id="del">
                ×
                <small>Delete</small>
            </button>

            <button id="undo">
                ↶
                <small>Undo</small>
            </button>

            <button id="redo">
                ↷
                <small>Redo</small>
            </button>
        </div>

        <div>
            <button id="grid">
                ⌗
                <small>Grid</small>
            </button>

            <button id="snap">
                ⌁
                <small>Snap</small>
            </button>

            <button id="wire">
                ◇
                <small>Wire</small>
            </button>
        </div>

    </aside>

    <main id="view">

        <div class="hud">
            3D VIEWPORT
            <span id="fps">60 FPS</span>
        </div>

        <div id="sel"></div>

        <section id="cameraMode" hidden>

            <canvas id="cameraCanvas"></canvas>

            <div class="camTop">
                <b>● CAMERA VIEW</b>
                <span id="camName"></span>
                <span id="camTime"></span>
                <button id="camExit">×</button>
            </div>

            <div class="camBottom">
                <span id="camState">LIVE</span>

                <span>
                    <button id="camPlay">▶</button>
                    <button id="camPause">❚❚</button>
                    <button id="camStop">■</button>
                </span>
            </div>

            <i class="safe"></i>

        </section>

    </main>

    <aside id="side">

        <section>
            <h3>
                SCENE
                <span id="count"></span>
            </h3>

            <div id="outliner"></div>
        </section>

        <section>
            <h3>PROPERTIES</h3>

            <div id="props"></div>
        </section>

    </aside>

    <section id="timeline">

        <div>
            <button id="key">◆ Keyframe</button>
            <button id="play">▶</button>
            <button id="pause">❚❚</button>
            <button id="stop">■</button>
            <button id="prev">◀|</button>
            <button id="next">|▶</button>

            <b id="time">0.00s</b>

            <label>
                Duration
                <input
                    id="duration"
                    type="number"
                    min="1"
                    max="120"
                    value="5"
                >
            </label>
        </div>

        <div class="track">
            <div id="keys"></div>

            <input
                id="slider"
                type="range"
                min="0"
                max="5"
                step=".01"
                value="0"
            >
        </div>

    </section>

    <footer>
        <i></i>
        <span id="status">Ready</span>
        <span id="stats"></span>
    </footer>

    <div id="toast"></div>

    <div id="modal" hidden>

        <article>

            <header>
                <b id="mt"></b>
                <button id="mx">×</button>
            </header>

            <div id="mb"></div>

        </article>

    </div>

    <input id="file" type="file" hidden>

    <input
        id="png"
        type="file"
        accept="image/png"
        hidden
    >

    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
